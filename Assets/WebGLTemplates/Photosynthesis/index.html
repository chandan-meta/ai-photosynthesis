<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="Dr. Curio's interactive investigation: follow carbon dioxide, water and sunlight into a leaf and catch it making food.">
    <meta name="theme-color" content="#04140a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 54C8 30 24 12 56 8c2 30-16 48-46 46z' fill='%2357c43a'/%3E%3Cpath d='M12 52C26 38 38 26 52 12' stroke='%23d8ffb0' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04140a; }
      body > canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #04140a; outline: none; }

      /* The artwork and bar share one 1672 x 941 coordinate system. */
      .loader { position: fixed; inset: 0; z-index: 10; overflow: hidden; background: #010e07;
        font-family: "Segoe UI", system-ui, sans-serif; color: #e9f5e6;
        transition: opacity .75s ease, visibility .75s; }
      .loader.out { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader .art { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: max(100vw, 177.683315vh); aspect-ratio: 1672 / 941;
        /* Cap cropping on portrait and ultrawide screens to keep the title and bar visible. */
        max-width: min(240vw, 200vh); }
      .loader .background { display: block; width: 100%; height: auto; }
      .loader .motes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .loader .motes i { position: absolute; bottom: -5%; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, #e5ffb3 0%, #beef7870 24%, #a4e55800 70%);
        animation: rise var(--duration) linear var(--delay) infinite; }
      .loader .motes i.bubble { border: 1px solid #d8f99b20;
        background: radial-gradient(circle at 32% 26%, #f2ffd45c, #b9ed6f12 24%, #94d25004 55%, #bbeb751f 74%, transparent 76%);
        box-shadow: inset 0 0 8px #c9fa6c16, 0 0 12px #a4e55812; }
      /* Opaque track hides the baked-in fill, including when real progress is zero. */
      .loader .bar { position: absolute; left: 34.629187%; top: 73.645058%; width: 30.502392%; height: 3.719447%;
        box-sizing: border-box; border: 1px solid #719c3e; border-radius: 999px; overflow: hidden;
        background: linear-gradient(#061e0a, #0c3011);
        box-shadow: inset 0 2px 6px #0009, 0 0 3px 1px #08290a, 0 0 16px #75d32620; }
      .loader .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; overflow: hidden;
        background: linear-gradient(180deg, #f2ffc26b, transparent 42%, #3e960826), linear-gradient(90deg, #64d800, #aeed32 62%, #f5ff85);
        box-shadow: inset 0 1px 2px #ffffc7, inset 0 -2px 3px #45840075, 0 0 14px #b7f94c80;
        transition: width .45s ease-out; }
      .loader .fill::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(105deg, transparent 35%, #ffffff38 50%, transparent 65%);
        animation: shine 4.8s ease-in-out infinite; }
      .loader .details { position: absolute; top: 79%; left: 50%; transform: translateX(-50%);
        width: min(620px, 92vw); text-align: center; font-size: 13px; line-height: 1.5; }
      .loader .status { margin: 0; color: #cee3bd; }
      .loader .pct { margin-left: .6em; color: #bef187; font-variant-numeric: tabular-nums; }
      .loader .note { margin: 4px 0 0; color: #cee3bd; font-size: 12px; font-variant-numeric: tabular-nums; }
      .loader .note:empty { display: none; }
      .loader .play { display: inline-block; margin-top: 12px; padding: 10px 26px; border-radius: 999px;
        text-decoration: none; font-size: 14px; font-weight: 600; color: #06240f;
        background: linear-gradient(90deg, #90e549, #e1fc9a); box-shadow: 0 0 18px #8ce65a40; }
      .loader .play:hover, .loader .play:focus-visible { outline: 2px solid #e1fc9a; outline-offset: 4px; }
      .loader .play[hidden] { display: none; }
      .loader.err .tip { color: #ffb8a6; }
      .loader.err .fill { background: linear-gradient(90deg, #8a3a2a, #c8664a); }
      .loader.err *, .loader.err *::after { animation-play-state: paused; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; border: 0; }
      @keyframes rise {
        0% { transform: translate(0, 0); opacity: 0; }
        15%, 75% { opacity: var(--o); }
        100% { transform: translate(var(--dx), -85vh); opacity: 0; }
      }
      @keyframes shine { 0%, 25% { transform: translateX(-100%); } 75%, 100% { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        .loader, .loader *, .loader *::after { animation: none !important; transition: none !important; }
        .loader .motes { display: none; }
      }

      .warn { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 20; display: none;
        font: 13px "Segoe UI", system-ui, sans-serif; max-width: 90vw; }
      .warn div { margin: 4px 0; padding: 8px 12px; border-radius: 8px; background: #f5d76e; color: #1e1505; }
      .warn div.e { background: #c0392b; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div class="loader">
      <h1 class="sr-only">Loading Photosynthesis Module</h1>
      <div class="art">
        <img class="background" src="loading-background.png" width="1672" height="941" alt="" fetchpriority="high">
        <div class="motes" aria-hidden="true"></div>
        <div class="bar" role="progressbar" aria-label="Loading Photosynthesis Module" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div>
        <div class="details">
          <p class="status"><span class="tip">Loading resources…</span><span class="pct">0%</span></p>
          <p class="note"></p>
          <a class="play" href="./" hidden>Play the module</a>
        </div>
      </div>
    </div>
    <div class="warn"></div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      (function () {
        var canvas = document.getElementById("unity-canvas");
        var loader = document.querySelector(".loader");
        var fill = loader.querySelector(".fill"), bar = loader.querySelector(".bar");
        var tip = loader.querySelector(".tip"), pct = loader.querySelector(".pct"), note = loader.querySelector(".note");

        // A few translucent orbs and dust motes drift beside the central artwork.
        var motes = loader.querySelector(".motes");
        for (var i = 0; i < 16; i++) {
          var m = document.createElement("i"), big = i % 5 === 0, size = big ? 18 + Math.random() * 16 : 3 + Math.random() * 4;
          m.className = big ? "bubble" : "";
          m.style.cssText = "left:" + ((i % 2 ? 73 : 8) + Math.random() * 18).toFixed(1) + "%;width:" + size.toFixed(1) + "px;height:" + size.toFixed(1) + "px;"
            + "--dx:" + ((Math.random() - .5) * 4).toFixed(1) + "vw;--o:" + (big ? .32 : .45) + ";"
            + "--duration:" + (24 + Math.random() * 16).toFixed(1) + "s;--delay:-" + (Math.random() * 40).toFixed(1) + "s";
          motes.appendChild(m);
        }

        var progress = 0, completed = false;
        function setProgress(p) {
          if (!Number.isFinite(p)) return;
          // Unity's progress callback can reach 1 before its startup promise resolves.
          progress = Math.max(progress, Math.min(completed ? 1 : .99, Math.max(0, p)));
          fill.style.width = (100 * progress) + "%";
          pct.textContent = Math.floor(progress * 100) + "%";
          bar.setAttribute("aria-valuenow", Math.floor(progress * 100));
        }
        function done() {
          completed = true; setProgress(1); tip.textContent = "Ready"; note.textContent = "";
          // Let the .45s fill settle, hold at full, then reveal the running module.
          setTimeout(function () {
            loader.classList.add("out");
            setTimeout(function () { loader.remove(); canvas.focus(); }, 800);
          }, 700);
        }
        function fail(e) {
          loader.classList.add("err"); note.textContent = "";
          tip.setAttribute("role", "alert");
          tip.textContent = "The module could not load: " + (e && e.message ? e.message : e) + ". Please reload the page.";
        }
        function unityShowBanner(msg, type) {
          var box = document.querySelector(".warn"), d = document.createElement("div");
          d.textContent = msg; if (type === "error") d.className = "e";
          box.appendChild(d); box.style.display = "block";
          if (type !== "error") setTimeout(function () { d.remove(); if (!box.children.length) box.style.display = "none"; }, 5000);
        }

        // ?loader shows the loading screen alone, for design checks: one pass of the bar, marked as a preview, with a way into the game
        if (/[?&]loader\b/.test(location.search)) {
          note.textContent = "Preview of the loading screen only: the module does not load on this page.";
          loader.querySelector(".play").hidden = false;
          var demo = 0, demoTimer = setInterval(function () {
            demo = Math.min(1, demo + .006); completed = demo >= 1; setProgress(demo);
            if (demo >= 1) { clearInterval(demoTimer); tip.textContent = "Ready!"; }
          }, 60);
          return;
        }

        var config = {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          showBanner: unityShowBanner
        };

        // GitHub Pages copy: Tools/WebGL/pages_site.py fills this line in, because GitHub refuses files over 100 MB and the
        // data file is served in parts that are joined here before Unity starts
        var dataParts = null, dataBytes = 0;
        function joinParts(onProgress) {
          var received = 0;
          return Promise.all(dataParts.map(function (url) {
            return fetch(url).then(function (r) {
              if (!r.ok) throw new Error("could not download " + url + " (HTTP " + r.status + ")");
              var reader = r.body.getReader(), chunks = [];
              function pump() {
                return reader.read().then(function (s) {
                  if (s.done) return new Blob(chunks);
                  chunks.push(s.value); received += s.value.length; onProgress(received);
                  return pump();
                });
              }
              return pump();
            });
          })).then(function (blobs) { return URL.createObjectURL(new Blob(blobs)); });
        }

        // the note under the bar shows that a slow download is still moving, and that the last step (Unity starting up) is not a hang
        var starting = "Starting the module, this can take a moment…", shownMB = -1;
        var base = dataParts ? .9 : 0;
        var ready = dataParts
          ? joinParts(function (received) {
              setProgress(base * Math.min(1, received / dataBytes));
              var m = Math.round(received / 1e6);
              if (m !== shownMB) { shownMB = m; note.textContent = "Downloading " + m + " of " + Math.round(dataBytes / 1e6) + " MB"; }
            }).then(function (url) {
              config.dataUrl = url;
              config.cacheControl = function (u) { return u.indexOf("blob:") === 0 ? "no-store" : "must-revalidate"; };
              note.textContent = starting;
            })
          : Promise.resolve();
        ready.then(function () {
          if (typeof createUnityInstance !== "function") throw new Error("the game loader is missing");
          return createUnityInstance(canvas, config, function (p) {
            setProgress(base + (1 - base) * p);
            if (p >= .9 && note.textContent !== starting) note.textContent = starting;
          });
        }).then(done).catch(fail);
      })();
    </script>
  </body>
</html>
